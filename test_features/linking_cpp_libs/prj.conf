# ──────────────────────────────────────────────────────
# Enable C++ language support in Zephyr
# ──────────────────────────────────────────────────────
CONFIG_CPP=y

# Enable C++ standard library (provides <string>, <vector>, <memory>, etc.)
CONFIG_GLIBCXX_LIBCPP=y

# Enable exceptions support (nmea_parser uses std::stod which may throw)
CONFIG_CPP_EXCEPTIONS=y

# Increase main thread stack — C++ std::string/std::vector need more stack
CONFIG_MAIN_STACK_SIZE=8192

# Optional: enable printk for console output
CONFIG_PRINTK=y

# Increase system heap for C++ new/delete allocations
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_RTTI=y

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n

# Console and logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
