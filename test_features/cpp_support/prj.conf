CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_RTTI=y # # Disable RTTI can save code size
CONFIG_CPP_EXCEPTIONS=y # Disable exceptions can save ~50KB

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n

# Allocate a 64KB global heap memory pool for dynamic allocations
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_ASSERT=y

# Recommended: Expand stack sizes to prevent overflows caused by heavy exception frames
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Console and logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_CPP_SUPPORT_SIMPLE_TEST=y
CONFIG_CPP_SUPPORT_ADVANCED_TEST=y